setup.p3.pkg_title=Pakete
setup.p3.pkg_intro=Dein Node kann mehr: Diese Pakete werden per USB übertragen und starten sofort. Du kannst sie auch später jederzeit installieren.
setup.p3.pkg_llm=KI-Chat — Sprachmodell Qwen3-4B, läuft auf Grafik- und Tensor-Einheit (3,3 GB)
setup.p3.pkg_stt=Spracherkennung — Whisper large-v3-turbo auf der Tensor-Einheit (1,2 GB)
setup.p3.pkg_btn=Pakete installieren
setup.p3.pkg_pick=Wähle mindestens ein Paket aus.
setup.p3.pkg_starting=Vorbereitung …
setup.steps.packages=Pakete
core.kit.wait_dev=Warte auf das Telefon (USB) …
core.kit.no_dev=Das Telefon ist nicht per USB erreichbar. Kabel prüfen, dann »Pakete installieren« erneut drücken.
core.kit.llm_name=KI-Chat
core.kit.stt_name=Spracherkennung
core.kit.push=%s: Paketdaten werden übertragen …
core.kit.push_model=%s: Modell wird übertragen …
core.kit.extract=%s: wird auf dem Telefon entpackt …
core.kit.start=%s: Dienst startet …
core.kit.ok=%s ist installiert.
core.kit.all_ok=Alle gewählten Pakete sind installiert — nichts läuft automatisch. Starte bei Bedarf: KI-Chat llmserver.sh start (Port 8080), Spracherkennung sttserver.sh start (Port 8090), Sprecher-Trennung pyaserver.sh start, Sprachausgabe ttsserver.sh start (Port 8095), Weckwort wakeserver.sh start.
core.kit.fail=Paket-Installation fehlgeschlagen: %s — Kabel prüfen und erneut versuchen.
core.kit.both_note=Die Pakete sind installiert — nichts läuft automatisch. Wichtig: KI-Chat kann NICHT gleichzeitig mit Spracherkennung/Sprecher-Trennung laufen — starte llmserver.sh start ODER sttserver.sh/pyaserver.sh start. Unabhängig davon: ttsserver.sh start (Sprachausgabe), wakeserver.sh start (Weckwort).
llm.stt_running=Spracherkennung (sttserver) läuft — erst stoppen: sttserver.sh stop. Gemeinsamer Betrieb übersteigt Speicher und TPU-Limit.

setup.model.llm_gemma_e2b=Google Gemma 4 E2B
setup.model.llm_gemma_e2b_desc=Googles On-Device-Modell (April 2026, Apache 2.0), 2-Mrd.-Effektiv-Klasse, offizielle QAT-Quantisierung: 3,2 GB Download. Gemessen auf dem Node: Antworten 11,9 Tokens/s (ca. 9 Wörter — das schnellste Modell der 4B-Klasse), Eingabe-Analyse 34 Tokens/s (Tensor-Einheit entlastet Grafikeinheit und Prozessor, Tempo ähnlich).
setup.model.llm_gemma_e4b=Google Gemma 4 E4B
setup.model.llm_gemma_e4b_desc=Die große On-Device-Variante: real 7,5 Mrd. Parameter, wegen der 8-GB-Speichergrenze q3-quantisiert (3,9 GB Download). Beste Antwortqualität im Angebot — aber gemessen nur 3,4 Tokens/s (ca. 2,5 Wörter). Qualität vor Tempo; läuft nur solo ohne andere Dienste.

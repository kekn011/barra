core.uf.neither=Gerät weder in Android noch im Bootloader. Telefon aus → Power+Leiser halten → Bootloader, dann »Erneut starten«.
core.uf.locked_already=Bootloader ist gesperrt — dann ist das schon ein Werksgerät (oder es lässt sich nicht flashen). Nichts zu tun.
core.uf.bl_ok=Bootloader erreicht (entsperrt).
core.uf.wipe_warn=Das LÖSCHT ALLES auf dem Telefon (barra, Container, Daten) und stellt Google-Stock her.
core.uf.flashed=Werks-Image geflasht, Daten gelöscht.
core.uf.lock_info=Gesperrt = echter Werkszustand (grüner Boot, keine Warnung). Ungesperrt = das Telefon kann sofort wieder für barra genutzt werden.
core.uf.lock_q=Bootloader jetzt wieder sperren? (Für späteres barra-Flashen müsste er erneut entsperrt werden.)
core.uf.tel_lock=Bildschirm »Lock the bootloader?« → mit Lauter/Leiser auf »Lock the bootloader« → Power drücken. (Löscht nochmal, startet dann neu.)
core.uf.locked=Bootloader gesperrt.
core.uf.not_locked=Sperre nicht bestätigt — Telefon bleibt entsperrt (Stock läuft trotzdem).
core.uf.stays=Bootloader bleibt entsperrt.
core.uf.done=Das Telefon startet jetzt Stock Android 16 (erster Start: einige Minuten, normaler Google-Setup).

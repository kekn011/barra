core.s3.tel3=3) Wenn Magisk fragt, ob »Shell« Superuser-Rechte bekommen darf: Erlauben — das ist dieses Setup. Kommt keine Frage: in der Magisk-App den Reiter »Superuser« öffnen und »Shell« einschalten.
core.s3.open_app=Öffne die Magisk-App auf dem Telefon …
core.s3.wait_magisk=Warte auf die Magisk-Einrichtung
core.s3.root_ok2=Systemrechte eingerichtet.
core.s3.remind=Noch kein Neustart erkannt — bitte in der Magisk-App »Zusätzliche Einrichtung« mit OK bestätigen.
core.s3.no_root=Die Systemrechte kamen nicht durch. In der Magisk-App: Reiter »Superuser« → »Shell« einschalten, dann »Erneut starten«.
core.s4.already=barra ist bereits installiert.
core.s4.pre_missing=barra ist installiert, deine Einrichtung fehlt noch — sie wird jetzt übernommen.
core.s4.pre_apply=Übernehme deine Einrichtung …
core.s4.pre_fail=Deine Einrichtung konnte nicht übernommen werden. »Erneut starten«. (Details im Protokoll)
core.s4.pre_ok=Einrichtung übernommen.
core.s4.tar_missing=Das barra-Systempaket fehlt auf diesem PC. Lade es erneut herunter (siehe Anleitung).
core.s4.push=Übertrage barra auf das Telefon …
core.s4.retry=Die Übertragung ist abgerissen — Versuch %s von 3 …
core.s4.wait_dev=Warte auf das Telefon
core.s4.push_pct=Übertrage barra · %s %%
core.s4.push_fail=Die Übertragung ist dreimal abgerissen. Kabel und USB-Buchse prüfen, dann »Erneut starten«.
core.s4.install=Richte barra auf dem Telefon ein …
core.s4.install_prog=Richte barra ein …
core.s4.incomplete=Die Installation ist unvollständig geblieben. »Erneut starten«. (Details im Protokoll)
core.s4.ok=barra ist installiert, der erste Start ist vorbereitet.
core.s5.intro=Das Telefon startet jetzt mehrmals neu — das gehört dazu. Danach siehst du: Google-Logo → barra-Ladebildschirm → Dashboard. Insgesamt 3–5 Minuten, du musst nichts tun.
core.s5.reboots=Telefon startet neu (gehört zur Erst-Einrichtung)
core.s5.restarting=Telefon startet neu
core.s5.no_adb=Das Telefon meldet sich nach dem Neustart nicht (Kabel ab- und anstecken?).
core.s5.stage=Erster Start · %s
core.s5.wait_ip=Warte auf die WLAN-Adresse …
core.s5.ok=Dein barra-Node läuft: %s
core.uf.to_bl=Starte das Telefon in den Bootloader …
core.uf.allow=Abfrage »USB-Debugging zulassen?« am Telefon → Zulassen.
core.uf.wait_grant=Warte auf die Freigabe
core.uf.no_grant=USB-Debugging wurde nicht freigegeben. Alternativ: Telefon ausschalten, dann Power + Leiser gedrückt halten → Bootloader-Menü, dann »Erneut starten«.
core.uf.neither=Das Telefon meldet sich weder in Android noch im Bootloader. Telefon ausschalten → Power + Leiser gedrückt halten → Bootloader-Menü, dann »Erneut starten«.
core.uf.locked_already=Der Bootloader ist gesperrt — das Telefon ist bereits im Werkszustand. Nichts zu tun.
core.uf.bl_ok=Bootloader erreicht (entsperrt).
core.uf.wipe_warn=Jetzt wird ALLES auf dem Telefon gelöscht (barra und alle Daten) und das originale Google-Android aufgespielt.
core.uf.flashed=Original-Android aufgespielt, Daten gelöscht.
core.uf.lock_info=Gesperrt = echter Werkszustand (normaler Start ohne Warnhinweis). Ungesperrt = das Telefon kann sofort wieder für barra genutzt werden.
core.uf.lock_q=Bootloader jetzt wieder sperren? (Für eine spätere barra-Installation müsste er erneut entsperrt werden.)
core.uf.tel_lock=Am Telefon erscheint »Lock the bootloader?« → mit Lauter/Leiser »Lock the bootloader« auswählen → Power drücken. (Löscht noch einmal, dann Neustart.)
core.uf.locked=Bootloader gesperrt.
core.uf.not_locked=Die Sperre wurde nicht bestätigt — das Telefon bleibt entsperrt (das Original-Android läuft trotzdem).
core.uf.stays=Der Bootloader bleibt entsperrt.
core.uf.done=Das Telefon startet jetzt das originale Google-Android (erster Start: einige Minuten, dann die normale Google-Einrichtung).

# --- Pakete-Bildschirm (Seite 1b) ---
setup.pager_pkg=Pakete
setup.pager_model=Modellwahl
setup.pkg.title=Pakete auswählen
setup.pkg.intro=Dein Node kann direkt mit KI-Funktionen eingerichtet werden. Wähle, was installiert werden soll — die Daten werden nach der Einrichtung automatisch per USB übertragen. Alles läuft vollständig auf dem Gerät: ohne Cloud, ohne Internet, ohne Konto. Jedes Paket lässt sich auch später jederzeit nachinstallieren.
setup.pkg.llm_name=KI-Chat (Sprachmodell)
setup.pkg.llm_desc=Ein vollwertiger KI-Assistent auf deinem Node: Chat-Oberfläche im Browser plus OpenAI-kompatible Schnittstelle für eigene Programme. Das Sprachmodell läuft auf der Grafik- und der Tensor-Einheit des Geräts — deine Eingaben verlassen das Gerät nie. Antwortet mit rund 10 Wörtern pro Sekunde, versteht Deutsch und Englisch.
setup.pkg.llm_fact=3,3 GB · Chat im Browser (Port 8080) · nicht gleichzeitig mit Spracherkennung/Sprecher-Trennung
setup.pkg.stt_name=Spracherkennung (Whisper)
setup.pkg.stt_desc=Wandelt Audioaufnahmen in Text um — schneller als Echtzeit und in Studioqualität (Whisper large-v3-turbo, über 90 Sprachen). Der rechenintensive Teil läuft auf der Tensor-Einheit. Die Nutzung ist bewusst einfach: Audiodatei per HTTP an den Node schicken, fertigen Text zurückbekommen.
setup.pkg.stt_fact=1,2 GB · HTTP-Dienst (Port 8090) · nicht gleichzeitig mit dem KI-Chat
setup.pkg.pya_name=Sprecher-Trennung (Diarization)
setup.pkg.pya_desc=Erkennt in einer Aufnahme, wer wann spricht: Besprechungen, Interviews oder Podcasts werden in Sprecherabschnitte mit Zeitmarken zerlegt. Die Sprecher-Erkennung läuft auf der Tensor-Einheit — ein einstündiges Meeting ist in wenigen Minuten analysiert. Zusammen mit der Spracherkennung entsteht daraus ein Protokoll mit Sprecherzuordnung.
setup.pkg.pya_fact=74 MB · Kommandozeile: barra-diarize aufnahme.wav · läuft auch zusammen mit der Spracherkennung
setup.pkg.coex_warn=Hinweis: KI-Chat und Spracherkennung/Sprecher-Trennung passen nicht gleichzeitig in den Speicher. Es wird alles installiert, aber kein Dienst automatisch gestartet — du startest dann selbst, was du gerade brauchst.
# --- Modellwahl (Seite 1c) ---
setup.model.title=Modell wählen — %s
setup.model.intro=Dieses Modell wird auf den Node installiert.
setup.model.llm_qwen4b=Qwen3-4B (empfohlen)
setup.model.llm_qwen4b_desc=Alibabas Allround-Modell: 4 Mrd. Parameter, 4-bit-quantisiert, 2,5 GB Download. Gemessen auf dem Node: Antworten 10,7 Tokens/s (ca. 8 Wörter), Eingabe-Analyse 20 Tokens/s (Tensor-Einheit +18 %, Qualität unverändert). Bestes Gesamtpaket: gutes Deutsch und Englisch, solide bei Code und Zusammenfassungen.
setup.model.stt_turbo=Whisper large-v3-turbo (empfohlen)
setup.model.stt_turbo_desc=OpenAIs bestes Diktiermodell (large-v3-turbo, Decoder q5-quantisiert, 547 MB Download): über 90 Sprachen, höchste Genauigkeit im Angebot. Gemessen auf dem Node: knapp schneller als Echtzeit (29 s Audio in 27 s); der Encoder läuft auf der Tensor-Einheit und ist damit 6-mal schneller als auf dem Grafikkern.
setup.model.pya_r34=wespeaker ResNet34 (empfohlen)
setup.model.pya_r34_desc=Bewährtes Sprecher-Erkennungsmodell (wespeaker ResNet34, VoxCeleb-trainiert) mit pyannote-Segmentierung 3.0; im Paket enthalten. Gemessen auf dem Node: 1 Minute Gespräch in ca. 4,5 s ausgewertet — die Sprecher-Embeddings rechnet die Tensor-Einheit (3 ms pro 3-s-Abschnitt). Standard für Deutsch, Englisch und die meisten Sprachen.
# --- pya im Fertig-Panel + Kern ---
setup.p3.pkg_pya=Sprecher-Trennung — pyannote/wespeaker auf der Tensor-Einheit (74 MB)
core.kit.pya_name=Sprecher-Trennung
# --- tts (Sprachausgabe) ---
setup.pkg.tts_name=Sprachausgabe (Text-to-Speech)
setup.pkg.tts_desc=Liest Text laut vor — direkt über den eingebauten Lautsprecher. Drei Stimmen: eine ausdrucksstarke englische Erzählerstimme sowie je eine natürliche deutsche und englische Stimme. Die aufwendige englische Stimme rechnet auf dem Grafikkern und hält den Prozessor frei. Abruf per HTTP — ideal als Sprachantwort im Zusammenspiel mit Weckwort, Spracherkennung und KI-Chat.
setup.pkg.tts_fact=300 MB · HTTP-Dienst (Port 8095) · manueller Start (ttsserver.sh), kein Boot-Autostart
setup.model.tts_all=Drei Stimmen (David, Thorsten, Amy)
setup.model.tts_all_desc=Ein Paket mit drei Stimmen: David, eine ausdrucksstarke englische Erzählerstimme (VITS-Modell), sowie Thorsten (Deutsch) und Amy (Englisch) aus dem freien Piper-Projekt. Gemessen auf dem Node: David erzeugt 5 Sekunden Sprache in gut 3,5 Sekunden — der Vokoder läuft auf dem Grafikkern und hält den Prozessor frei; Thorsten und Amy sind noch schneller. Die Stimme wird pro Anfrage gewählt, Ausgabe direkt über den Lautsprecher.
setup.p3.pkg_tts=Sprachausgabe — David (Grafikkern) + Piper Thorsten/Amy (300 MB)
core.kit.tts_name=Sprachausgabe
# --- wake (Weckwort) ---
setup.pkg.wake_name=Weckwort ("Hey Barra")
setup.pkg.wake_desc=Lässt den Node dauerhaft auf das Weckwort „Hey Barra" lauschen — die Grundlage für einen sprachgesteuerten Ablauf (Weckwort, Spracherkennung, KI-Chat, Sprachantwort). Die Erkennung ist federleicht und läuft auf dem Prozessor. Bei einem Treffer wird ein Auslöser gesetzt, an den sich eigene Aktionen hängen lassen.
setup.pkg.wake_fact=17 MB · manueller Start (wakeserver.sh), kein Boot-Autostart · nutzt das eingebaute Mikrofon
setup.model.wake_heybarra=Weckwort „Hey Barra"
setup.model.wake_heybarra_desc=Streaming-Erkenner (sherpa-onnx Zipformer, int8, 5 MB) auf das feste Weckwort „Hey Barra". Gemessen auf dem Node: erkennt zuverlässig live über das eingebaute Mikrofon, immer-lauschend bei minimaler Last (unter einem Zehntel eines Prozessorkerns). Treffer landen in /run/barra-wake/trigger.
setup.p3.pkg_wake=Weckwort „Hey Barra" — immer-lauschende Erkennung (17 MB)
core.kit.wake_name=Weckwort

# --- Modellwahl: weitere Modelle (22.8.) ---
setup.model.llm_qwen15b=Qwen2.5-1.5B (schnell)
setup.model.llm_qwen15b_desc=Alibabas Kompaktmodell: 1,5 Mrd. Parameter, 1,1 GB Download. Gemessen auf dem Node: Antworten 24 Tokens/s (ca. 18 Wörter, doppelt so schnell wie Qwen3-4B), Eingabe-Analyse 47 Tokens/s (Tensor-Einheit +5 %). Für kurze Fragen, Zusammenfassungen und Automatisierung; bei komplexen Aufgaben merklich schwächer als die 4B-Klasse.
setup.model.llm_glmedge=GLM-Edge-4B-Chat
setup.model.llm_glmedge_desc=Zhipus Edge-Modell der 4B-Klasse, für Geräte-Einsatz trainiert: 2,5 GB Download. Gemessen auf dem Node: Antworten 9,9 Tokens/s (ca. 7 Wörter), Eingabe-Analyse 17 Tokens/s (Tensor-Einheit +8 %, Qualität unverändert). Stärken in Chinesisch und Englisch.
setup.model.llm_qwen38d=Qwen3.8-4B-Distill
setup.model.llm_qwen38d_desc=Community-Destillat der neuen Qwen3.8-Generation (Hybrid-Architektur mit DeltaNet-Schichten): 2,6 GB Download. Gemessen auf dem Node: Antworten 9,5 Tokens/s (ca. 7 Wörter), Eingabe-Analyse 16 Tokens/s. Neueste Architektur zum Ausprobieren; ohne Tensor-Beschleunigung (nur 8 von 32 Schichten klassische Attention).
setup.model.stt_medium=Whisper medium
setup.model.stt_medium_desc=Zweitgrößtes Whisper-Modell (q5-quantisiert, 539 MB Download). Gemessen auf dem Node: 16 s Audio in 7,1 s = 2,3-mal Echtzeit (Encoder auf der Tensor-Einheit). Genauigkeit knapp unter turbo — die Wahl, wenn es etwas schneller sein soll.
setup.model.stt_small=Whisper small
setup.model.stt_small_desc=Whisper-Mittelklasse (466 MB Download). Gemessen auf dem Node: 16 s Audio in 4,7 s = 3,4-mal Echtzeit (Encoder auf der Tensor-Einheit). Guter Kompromiss aus Tempo und Genauigkeit.
setup.model.stt_base=Whisper base
setup.model.stt_base_desc=Kleines Whisper-Modell (142 MB Download). Gemessen auf dem Node: 16 s Audio in 2,6 s = 6-mal Echtzeit (Encoder auf der Tensor-Einheit). Für deutlich gesprochene Aufnahmen; Genauigkeit spürbar unter small und turbo.
setup.model.stt_tiny=Whisper tiny
setup.model.stt_tiny_desc=Das kleinste Whisper-Modell (74 MB Download). Gemessen auf dem Node: 16 s Audio in 2,3 s = 7-mal Echtzeit (Encoder auf der Tensor-Einheit). Genauigkeit deutlich eingeschränkt — für schnelle Entwürfe und Tests.
setup.model.pya_eres=ERes2Net (Chinesisch)
setup.model.pya_eres_desc=ERes2Net von 3D-Speaker, auf chinesischer Sprache trainiert (74 MB Download). Läuft auf der Tensor-Einheit mit Float-Feinschliff: Ergebnisse auf CPU-Referenz-Niveau, 1 Minute Gespräch in ca. 11 s. Die genauere, aber langsamere Alternative zum chinesischen ResNet34.
setup.model.pya_titanet=NVIDIA TitaNet small
setup.model.pya_titanet_desc=NVIDIAs Kompaktmodell (NeMo TitaNet small, 23 MB Download), auf Englisch trainiert. Läuft als 5-Segment-Kette auf der Tensor-Einheit, Ergebnisse identisch zur CPU-Referenz; 1 Minute Gespräch in ca. 11 s — kein Tempo-Plus (das Modell ist winzig), dafür bleibt der Prozessor frei. Alternative zum Standard für englische Aufnahmen.

setup.model.pya_r34zh=wespeaker ResNet34 (Chinesisch)
setup.model.pya_r34zh_desc=Dieselbe Architektur wie das Standard-Modell, auf chinesischer Sprache trainiert (CN-Celeb, 37 MB Download). Tempo identisch: 1 Minute Gespräch in ca. 4,5 s auf der Tensor-Einheit. Erste Wahl für chinesische Aufnahmen.


# --- Package screen (page 1b) ---
setup.pager_pkg=Packages
setup.pager_model=Model choice
setup.pkg.title=Choose packages
setup.pkg.intro=Your node can be set up with AI features right away. Pick what to install — the data is transferred automatically over USB after setup. Everything runs entirely on the device: no cloud, no internet, no account. Each package can also be installed later at any time.
setup.pkg.llm_name=AI chat (language model)
setup.pkg.llm_desc=A full AI assistant on your node: chat interface in the browser plus an OpenAI-compatible API for your own programs. The language model runs on the device's GPU and Tensor unit — your inputs never leave the device. Replies at about 10 words per second, understands English and German.
setup.pkg.llm_fact=3.3 GB · chat in the browser (port 8080) · not at the same time as speech recognition/speaker separation
setup.pkg.stt_name=Speech recognition (Whisper)
setup.pkg.stt_desc=Turns audio recordings into text — faster than real time and at studio quality (Whisper large-v3-turbo, 90+ languages). The heavy lifting runs on the Tensor unit. Usage is deliberately simple: send an audio file to the node via HTTP, get the finished text back.
setup.pkg.stt_fact=1.2 GB · HTTP service (port 8090) · not at the same time as AI chat
setup.pkg.pya_name=Speaker separation (diarization)
setup.pkg.pya_desc=Detects who speaks when in a recording: meetings, interviews or podcasts are split into speaker segments with timestamps. Speaker recognition runs on the Tensor unit — an hour-long meeting is analyzed in a few minutes. Combined with speech recognition this yields a transcript with speaker labels.
setup.pkg.pya_fact=74 MB · command line: barra-diarize recording.wav · can run alongside speech recognition
setup.pkg.coex_warn=Note: AI chat and speech recognition/speaker separation do not fit into memory at the same time. Everything is installed, but no service is started automatically — you start whichever you need.
# --- Model choice (page 1c) ---
setup.model.title=Choose model — %s
setup.model.intro=This model will be installed on the node.
setup.model.llm_qwen4b=Qwen3-4B (recommended)
setup.model.llm_qwen4b_desc=Alibaba's all-round model: 4B parameters, 4-bit quantized, 2.5 GB download. Measured on the node: replies at 10.7 tokens/s (about 8 words), prompt reading at 20 tokens/s (Tensor unit +18 %, quality unchanged). Best overall package: good English and German, solid at code and summaries.
setup.model.stt_turbo=Whisper large-v3-turbo (recommended)
setup.model.stt_turbo_desc=OpenAI's best dictation model (large-v3-turbo, q5-quantized decoder, 547 MB download): over 90 languages, highest accuracy on offer. Measured on the node: just faster than real time (29 s of audio in 27 s); the encoder runs on the Tensor unit, 6x faster than on the GPU.
setup.model.pya_r34=wespeaker ResNet34 (recommended)
setup.model.pya_r34_desc=Proven speaker recognition model (wespeaker ResNet34, VoxCeleb-trained) with pyannote segmentation 3.0; included in the package. Measured on the node: 1 minute of conversation analyzed in about 4.5 s — the speaker embeddings run on the Tensor unit (3 ms per 3 s chunk). The standard for English, German and most languages.
# --- pya on the done panel + core ---
setup.p3.pkg_pya=Speaker separation — pyannote/wespeaker on the Tensor unit (74 MB)
core.kit.pya_name=Speaker separation
# --- tts (speech output) ---
setup.pkg.tts_name=Speech output (text-to-speech)
setup.pkg.tts_desc=Reads text aloud — straight through the built-in speaker. Three voices: an expressive English narrator voice plus a natural German and English voice. The demanding English voice runs on the graphics core and keeps the processor free. Accessed over HTTP — ideal as a spoken reply together with wake word, speech recognition and the AI chat.
setup.pkg.tts_fact=300 MB · HTTP service (port 8095) · started manually (ttsserver.sh), no boot autostart
setup.model.tts_all=Three voices (David, Thorsten, Amy)
setup.model.tts_all_desc=One package with three voices: David, an expressive English narrator voice (VITS model), plus Thorsten (German) and Amy (English) from the free Piper project. Measured on the node: David produces 5 seconds of speech in a good 3.5 seconds — the vocoder runs on the graphics core and keeps the processor free; Thorsten and Amy are faster still. The voice is chosen per request, output straight through the speaker.
setup.p3.pkg_tts=Speech output — David (graphics core) + Piper Thorsten/Amy (300 MB)
core.kit.tts_name=Speech output
# --- wake (wake word) ---
setup.pkg.wake_name=Wake word ("Hey Barra")
setup.pkg.wake_desc=Keeps the node listening for the wake word "Hey Barra" — the basis for a voice-driven flow (wake word, speech recognition, AI chat, spoken reply). Detection is featherweight and runs on the processor. On a match it sets a trigger you can hook your own actions to.
setup.pkg.wake_fact=17 MB · started manually (wakeserver.sh), no boot autostart · uses the built-in microphone
setup.model.wake_heybarra=Wake word "Hey Barra"
setup.model.wake_heybarra_desc=Streaming spotter (sherpa-onnx Zipformer, int8, 5 MB) for the fixed wake word "Hey Barra". Measured on the node: reliably detected live through the built-in microphone, always-listening at minimal load (under a tenth of a processor core). Matches land in /run/barra-wake/trigger.
setup.p3.pkg_wake=Wake word "Hey Barra" — always-listening detection (17 MB)
core.kit.wake_name=Wake word
setup.pkg.img_name=Image generator (text-to-image)
setup.pkg.img_desc=Turns text descriptions into images — entirely on the device, no cloud. Stable Diffusion 1.5 (DreamShaper 8 with the LCM sampler) runs on the GPU with compute kernels written specifically for the Mali chip; a 512×512 image in 4 steps takes about 17 seconds. Available over HTTP or in the container via barra-img "…" — as a picture reply alongside AI chat and speech recognition.
setup.pkg.img_fact=2.2 GB · HTTP service (port 8096) · manual start (imgserver.sh), no boot autostart · holds 1.9 GB of RAM while running
setup.model.img_lcm=DreamShaper 8 LCM (Stable Diffusion 1.5)
setup.model.img_lcm_desc=Community model DreamShaper 8 (Lykon) on a Stable Diffusion 1.5 base with the LCM sampler baked in: 4 steps instead of 20–30, 2.1 GB (f16) plus the TAESD fast decoder (10 MB). Measured on the node: 512×512 in 16.5–17 s per image with the service running (3.8 s per step; the first image after start takes ~20 s). Photorealistic to illustrative, understands English prompts best; with stock Vulkan the same image took 117 s.
setup.p3.pkg_img=Image generator — Stable Diffusion 1.5 DreamShaper LCM on the GPU (2.2 GB)
core.kit.img_name=Image generator

# --- Model choice: additional models (22.8.) ---
setup.model.llm_qwen15b=Qwen2.5-1.5B (fast)
setup.model.llm_qwen15b_desc=Alibaba's compact model: 1.5B parameters, 1.1 GB download. Measured on the node: replies at 24 tokens/s (about 18 words, twice as fast as Qwen3-4B), prompt reading at 47 tokens/s (Tensor unit +5 %). For short questions, summaries and automation; noticeably weaker than the 4B class on complex tasks.
setup.model.llm_glmedge=GLM-Edge-4B-Chat
setup.model.llm_glmedge_desc=Zhipu's 4B-class edge model, trained for on-device use: 2.5 GB download. Measured on the node: replies at 9.9 tokens/s (about 7 words), prompt reading at 17 tokens/s (Tensor unit +8 %, quality unchanged). Strong in Chinese and English.
setup.model.llm_qwen38d=Qwen3.8-4B-Distill
setup.model.llm_qwen38d_desc=Community distill of the new Qwen3.8 generation (hybrid architecture with DeltaNet layers): 2.6 GB download. Measured on the node: replies at 9.5 tokens/s (about 7 words), prompt reading at 16 tokens/s. The newest architecture to try out; no Tensor acceleration (only 8 of 32 layers use classic attention).
setup.model.stt_medium=Whisper medium
setup.model.stt_medium_desc=Second-largest Whisper model (q5-quantized, 539 MB download). Measured on the node: 16 s of audio in 7.1 s = 2.3x real time (encoder on the Tensor unit). Accuracy just below turbo — the pick when it should be a bit faster.
setup.model.stt_small=Whisper small
setup.model.stt_small_desc=Whisper mid-range (466 MB download). Measured on the node: 16 s of audio in 4.7 s = 3.4x real time (encoder on the Tensor unit). A good balance of speed and accuracy.
setup.model.stt_base=Whisper base
setup.model.stt_base_desc=Small Whisper model (142 MB download). Measured on the node: 16 s of audio in 2.6 s = 6x real time (encoder on the Tensor unit). For clearly spoken recordings; accuracy noticeably below small and turbo.
setup.model.stt_tiny=Whisper tiny
setup.model.stt_tiny_desc=The smallest Whisper model (74 MB download). Measured on the node: 16 s of audio in 2.3 s = 7x real time (encoder on the Tensor unit). Accuracy clearly limited — for quick drafts and tests.
setup.model.pya_eres=ERes2Net (Chinese)
setup.model.pya_eres_desc=ERes2Net by 3D-Speaker, trained on Chinese speech (74 MB download). Runs on the Tensor unit with float fine-tuning: results at CPU-reference level, 1 minute of conversation in about 11 s. The more accurate but slower alternative to the Chinese ResNet34.
setup.model.pya_titanet=NVIDIA TitaNet small
setup.model.pya_titanet_desc=NVIDIA's compact model (NeMo TitaNet small, 23 MB download), trained on English. Runs as a 5-segment chain on the Tensor unit, results identical to the CPU reference; 1 minute of conversation in about 11 s — no speed gain (the model is tiny), but the CPU stays free. Alternative to the standard for English recordings.

setup.model.pya_r34zh=wespeaker ResNet34 (Chinese)
setup.model.pya_r34zh_desc=Same architecture as the standard model, trained on Chinese speech (CN-Celeb, 37 MB download). Same speed: 1 minute of conversation in about 4.5 s on the Tensor unit. First choice for Chinese recordings.


setup.model.llm_gemma_e2b=Google Gemma 4 E2B
setup.model.llm_gemma_e2b_desc=Google's on-device model (April 2026, Apache 2.0) in the 2B-effective class, official QAT quantization (3.2 GB). Measured on the node: about 11.5 words per second on the GPU — the fastest model of the 4B class on offer. Long inputs are co-read by the Tensor unit (offloads GPU and CPU; similar speed).
setup.model.llm_gemma_e4b=Google Gemma 4 E4B
setup.model.llm_gemma_e4b_desc=The larger on-device variant (7.5B parameters, q3-quantized 3.9 GB due to the 8 GB memory limit). Best answer quality on offer, but measured at only about 3.4 words per second — quality over speed, runs only solo without other services.

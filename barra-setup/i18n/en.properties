core.kit.both_note=The packages are installed — nothing runs automatically. Important: AI chat cannot run at the same time as speech recognition/speaker separation — start llmserver.sh start OR sttserver.sh/pyaserver.sh start. Independently: ttsserver.sh start (speech output), wakeserver.sh start (wake word), imgserver.sh start (image generator).
llm.stt_running=Speech-to-text (sttserver) is running — stop it first: sttserver.sh stop. Running both exceeds memory and the TPU limit.

setup.model.llm_gemma_e2b=Google Gemma 4 E2B
setup.model.llm_gemma_e2b_desc=Google's on-device model (April 2026, Apache 2.0), 2B-effective class, official QAT quantization: 3.2 GB download. Measured on the node: replies at 11.9 tokens/s (about 9 words — the fastest model in the 4B class), prompt reading at 34 tokens/s (Tensor unit offloads GPU and CPU, similar speed).
setup.model.llm_gemma_e4b=Google Gemma 4 E4B
setup.model.llm_gemma_e4b_desc=The large on-device variant: 7.5B real parameters, q3-quantized due to the 8 GB memory limit (3.9 GB download). Best answer quality on offer — but measured at only 3.4 tokens/s (about 2.5 words). Quality over speed; runs solo only, without other services.

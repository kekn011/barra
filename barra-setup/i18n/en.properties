# --- Package screen (page 1b) ---
setup.pager_pkg=Packages
setup.pager_model=Model choice
setup.pkg.title=Choose packages
setup.pkg.intro=Your node can be set up with AI features right away. Pick what to install — the data is transferred automatically over USB after setup. Everything runs entirely on the device: no cloud, no internet, no account. Each package can also be installed later at any time.
setup.pkg.llm_name=AI chat (language model)
setup.pkg.llm_desc=A full AI assistant on your node: chat interface in the browser plus an OpenAI-compatible API for your own programs. The language model runs on the device's GPU and Tensor unit — your inputs never leave the device. Replies at about 10 words per second, understands English and German.
setup.pkg.llm_fact=3.3 GB · chat in the browser (port 8080) · not at the same time as speech recognition/speaker separation
setup.pkg.stt_name=Speech recognition (Whisper)
setup.pkg.stt_desc=Turns audio recordings into text — faster than real time and at studio quality (Whisper large-v3-turbo, 90+ languages). The heavy lifting runs on the Tensor unit. Usage is deliberately simple: send an audio file to the node via HTTP, get the finished text back.
setup.pkg.stt_fact=1.2 GB · HTTP service (port 8090) · not at the same time as AI chat
setup.pkg.pya_name=Speaker separation (diarization)
setup.pkg.pya_desc=Detects who speaks when in a recording: meetings, interviews or podcasts are split into speaker segments with timestamps. Speaker recognition runs on the Tensor unit — an hour-long meeting is analyzed in a few minutes. Combined with speech recognition this yields a transcript with speaker labels.
setup.pkg.pya_fact=74 MB · command line: barra-diarize recording.wav · can run alongside speech recognition
setup.pkg.coex_warn=Note: AI chat and speech recognition/speaker separation do not fit into memory at the same time. Everything is installed, but no service is started automatically — you start whichever you need.
# --- Model choice (page 1c) ---
setup.model.title=Choose model — %s
setup.model.intro=This model will be installed on the node.
setup.model.llm_qwen4b=Qwen3-4B (recommended)
setup.model.llm_qwen4b_desc=All-round model with 4 billion parameters (4-bit quantized, 2.5 GB). Good English and German, solid at coding and summarizing. About 10 words per second on the node; long inputs are co-read by the Tensor unit (+18 % prompt reading speed, quality unchanged).
setup.model.stt_turbo=Whisper large-v3-turbo (recommended)
setup.model.stt_turbo_desc=The best everyday Whisper model: 90+ languages, very high accuracy, transcribes faster than real time (Tensor unit + GPU). Decoder q5-quantized, 547 MB.
setup.model.pya_r34=wespeaker ResNet34 (recommended)
setup.model.pya_r34_desc=Proven speaker recognition model (VoxCeleb-trained), combined with pyannote segmentation 3.0. Speaker embeddings run on the Tensor unit — 3 milliseconds per audio chunk.
# --- pya on the done panel + core ---
setup.p3.pkg_pya=Speaker separation — pyannote/wespeaker on the Tensor unit (74 MB)
core.kit.pya_name=Speaker separation

# --- Model choice: additional models (22.8.) ---
setup.model.llm_qwen15b=Qwen2.5-1.5B (fast)
setup.model.llm_qwen15b_desc=Small, snappy model (1.5 billion parameters, 1.1 GB): roughly double the speed of Qwen3-4B — about 23 words per second. Great for short questions, summaries and automation; noticeably weaker than the 4B class on complex tasks. Long inputs are co-read by the Tensor unit (+5 % prompt reading speed).
setup.model.llm_glmedge=GLM-Edge-4B-Chat
setup.model.llm_glmedge_desc=Zhipu's edge model in the 4B class (2.5 GB), trained specifically for on-device use. Strong in Chinese and English. Measured on the node: about 10 words per second on the GPU; long inputs are co-read by the Tensor unit (+8 % prompt reading speed, quality unchanged).
setup.model.llm_qwen38d=Qwen3.8-4B-Distill
setup.model.llm_qwen38d_desc=Community distillation of the new Qwen3.8 generation (hybrid architecture with DeltaNet layers, 2.6 GB). Measured on the node: about 9 words per second.
setup.model.stt_medium=Whisper medium
setup.model.stt_medium_desc=Second-largest Whisper model (539 MB, q5) with its own TPU encoder package set: very good accuracy, faster than real time. Accuracy just below the turbo model.
setup.model.stt_small=Whisper small
setup.model.stt_small_desc=Mid-range (466 MB) with its own TPU encoder package set: decent accuracy, much faster than real time. A good compromise between tiny and the turbo model.
setup.model.stt_base=Whisper base
setup.model.stt_base_desc=Small model (142 MB) with its own TPU encoder package set: transcribes far faster than real time (16-second test in 2.6 s). For simple, clearly spoken recordings; accuracy below the turbo model.
setup.model.stt_tiny=Whisper tiny
setup.model.stt_tiny_desc=The smallest model (74 MB) with its own TPU encoder package set: 16-second test in 2.3 s. Noticeably limited accuracy — for quick drafts and tests.
setup.model.pya_eres=ERes2Net (Chinese)
setup.model.pya_eres_desc=Speaker recognition model by 3D-Speaker, trained on Chinese speech. Runs on the Tensor unit (the fusion refinement exactly in float) — results at float quality. The strongest choice for Chinese recordings.
setup.model.pya_titanet=NVIDIA TitaNet small
setup.model.pya_titanet_desc=Compact speaker recognition model by NVIDIA/NeMo. Runs as a 5-segment chain on the Tensor unit (results identical to the CPU reference); since the model is tiny, the TPU mainly offloads the CPU here rather than adding speed. An alternative to ResNet34 for English recordings.

setup.model.pya_r34zh=wespeaker ResNet34 (Chinese)
setup.model.pya_r34zh_desc=Same architecture as the default model, but trained on Chinese speech (CN-Celeb). Runs on the Tensor unit just the same — 3 milliseconds per audio chunk. First choice for Chinese recordings.


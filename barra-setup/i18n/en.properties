core.kit.all_ok=All selected packages are installed — nothing runs automatically. Start as needed: AI chat llmserver.sh start (port 8080), speech recognition sttserver.sh start (port 8090), speaker separation pyaserver.sh start, speech output ttsserver.sh start (port 8095), wake word wakeserver.sh start, image generator imgserver.sh start (port 8096).

# barra: reboot/poweroff aus dem Container gehen ueber Android (cfgd 'power ...').
# Einbau als /etc/systemd/system/systemd-reboot.service.d/barra.conf (mit "reboot") und
# /etc/systemd/system/systemd-poweroff.service.d/barra.conf (mit "shutdown").
# Hintergrund in /usr/local/sbin/barra-power: im PID-Namespace des Containers wuerde
# systemd's eigenes reboot(2) nur den Container beenden, nicht das Telefon neu starten.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/barra-power __ACTION__
